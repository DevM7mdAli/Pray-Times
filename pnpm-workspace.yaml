packages:
  - apps/*
  - packages/*
  - tooling

allowBuilds:
  esbuild: true
  nx: true
  workerd: true

overrides:
  lightningcss: 1.30.1

# CocoaPods generates Expo SQLite's vendored C sources inside its package.
# Warn about that expected drift without reinstalling and deleting the files.
verifyDepsBeforeRun: warn
