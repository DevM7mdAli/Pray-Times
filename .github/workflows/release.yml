name: Package extension release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify, build, and package
        run: pnpm check
      - name: Validate release version and checksum
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p \"JSON.parse(require('node:fs').readFileSync('apps/extension/manifest.json', 'utf8')).version\")"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Tag $RELEASE_TAG must match manifest version v$VERSION." >&2
            exit 1
          fi
          ARCHIVE="artifacts/pray-times-$VERSION.zip"
          CHECKSUM="$ARCHIVE.sha256"
          test -f "$ARCHIVE"
          test -f "$CHECKSUM"
          (cd artifacts && sha256sum --check "$(basename "$CHECKSUM")")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "$CHECKSUM" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" "$CHECKSUM" \
              --title "Pray Times $RELEASE_VERSION" \
              --generate-notes
          fi
