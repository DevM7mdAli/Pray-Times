name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read
  # nrwl/nx-set-shas reads past runs of this workflow to find the last green
  # commit on main.
  actions: read

env:
  # Nx keeps its task cache under ~/.nx by default; pin it inside the checkout
  # so actions/cache can carry it between runs.
  NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Lint pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm exec commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
      - name: Lint an initial push
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: pnpm exec commitlint --from "$(git rev-list --max-parents=0 HEAD)" --to "${{ github.sha }}" --verbose

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # nx affected compares against the base commit, so it needs history.
          fetch-depth: 0
          filter: tree:0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pull requests compare against where the branch left main; pushes to
      # main compare against the last commit that passed this workflow.
      - uses: nrwl/nx-set-shas@v5
      - name: Restore the Nx cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      - run: pnpm format:check
      # Runs only the tasks whose inputs this change reaches. Packaging covers
      # Chrome, Firefox, and Safari, and lint-firefox runs the Firefox add-on
      # validator against the Firefox build.
      - run: pnpm exec nx affected -t check-tailwind typecheck lint test build package lint-firefox
      - name: Upload the browser packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          # Nothing is packaged when the change does not reach the extension.
          if-no-files-found: ignore

  safari:
    # A Safari extension ships inside an app bundle, so the only real check is
    # that Xcode accepts the manifest and builds the generated project.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      # The Xcode build is the slowest check here, so it only runs when the
      # change reaches the extension build or this workflow. The job itself
      # still succeeds so the release job, which needs it, is not skipped.
      - name: Check whether the extension build is affected
        id: affected
        run: |
          if pnpm exec nx show projects --affected -t build --json | grep -q '"@pray-times/extension"' ||
            git diff --name-only "$NX_BASE" "$NX_HEAD" | grep -qx '.github/workflows/ci.yml'; then
            echo "extension=true" >> "$GITHUB_OUTPUT"
          else
            echo "The extension build is not affected, so Safari is skipped"
            echo "extension=false" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm build:extension safari
        if: steps.affected.outputs.extension == 'true'
      - name: Convert the Safari build to an Xcode project
        if: steps.affected.outputs.extension == 'true'
        run: |
          xcrun safari-web-extension-converter apps/extension/dist/safari \
            --project-location "$RUNNER_TEMP/safari" \
            --app-name "Pray Times" \
            --bundle-identifier io.github.devm7mdali.praytimes \
            --swift --macos-only --no-open --no-prompt --force
      - name: Build the Safari app extension
        if: steps.affected.outputs.extension == 'true'
        # Only the extension target is built. Building the containing app adds a
        # ValidateEmbeddedBinary step that needs a real signing identity, which
        # CI does not have, and the appex is what carries the web extension.
        run: |
          project="$(find "$RUNNER_TEMP/safari" -maxdepth 2 -name '*.xcodeproj' -print -quit)"
          if [ -z "$project" ]; then
            echo "The converter produced no Xcode project" >&2
            exit 1
          fi
          target="$(xcodebuild -list -project "$project" -json |
            node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).project.targets.find((name) => name.endsWith("Extension"))')"
          if [ "$target" = "undefined" ]; then
            echo "The converted project has no extension target" >&2
            exit 1
          fi
          xcodebuild build \
            -project "$project" \
            -target "$target" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Upload the Safari Xcode project
        if: steps.affected.outputs.extension == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: safari-xcode-project
          path: ${{ runner.temp }}/safari
          if-no-files-found: error

  release:
    needs: [commitlint, verify, safari]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      # Lets the release start the Publish extension workflow.
      actions: write
    concurrency:
      group: semantic-release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Confirm this verified commit is current
        id: current
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.current.outputs.release == 'true'
      # Verify saved its cache for this exact commit, so the full run below
      # replays every task it already ran instead of repeating them.
      - name: Restore the Nx cache
        if: steps.current.outputs.release == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      # A release is cut from the whole workspace, so it checks every project
      # rather than only the affected ones.
      - run: pnpm verify:release
        if: steps.current.outputs.release == 'true'
      - name: Bootstrap the current extension version
        if: steps.current.outputs.release == 'true'
        id: bootstrap
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          if git tag --list 'v[0-9]*' | grep -q .; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="$(node -p 'JSON.parse(require("node:fs").readFileSync("apps/extension/manifest.base.json", "utf8")).version')"
          pnpm exec nx run @pray-times/tooling:set-version "$VERSION"
          pnpm package:extension
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/manifest.base.json apps/extension/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $VERSION [skip ci]"
          fi
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin HEAD:main "v$VERSION"
          gh release create "v$VERSION" \
            "artifacts/pray-times-chrome-$VERSION.zip" \
            "artifacts/pray-times-chrome-$VERSION.zip.sha256" \
            "artifacts/pray-times-firefox-$VERSION.zip" \
            "artifacts/pray-times-firefox-$VERSION.zip.sha256" \
            "artifacts/pray-times-safari-$VERSION.zip" \
            "artifacts/pray-times-safari-$VERSION.zip.sha256" \
            --title "Pray Times $VERSION" \
            --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Create semantic release
        if: steps.current.outputs.release == 'true' && steps.bootstrap.outputs.created != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: pnpm release
      # Both paths above tag the release commit they create and leave it checked
      # out, so a version tag on HEAD means this run published a new release.
      # Publishing runs as its own workflow so a store rejection or a pending
      # environment approval never holds up Verify or the landing-page deploy.
      - name: Start publishing to the browser stores
        if: steps.current.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(git tag --points-at HEAD --list 'v[0-9]*' | head -n 1)"
          if [ -z "$tag" ]; then
            echo "No new release, so nothing to publish"
            exit 0
          fi
          gh workflow run publish-extension.yml --ref main -f tag="$tag"
